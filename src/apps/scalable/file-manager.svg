<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#002550" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#001530" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bgLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d8ee8"/>
      <stop offset="50%" stop-color="#1976d2"/>
      <stop offset="100%" stop-color="#0d5db0"/>
    </linearGradient>
    <linearGradient id="bgRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b2ebf2"/>
      <stop offset="15%" stop-color="#80deea"/>
      <stop offset="60%" stop-color="#4dd0e1"/>
      <stop offset="100%" stop-color="#26c6da"/>
    </linearGradient>
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Shadow Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" filter="url(#shadow)" fill="#0d5db0"/>

  <!-- Left Face Half (Base Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgLeft)"/>

  <!-- Right Face Half (Smooth Right Squircle Arc) -->
  <path d="M 256,24 L 380,24 A 108,108 0 0,1 488,132 L 488,380 A 108,108 0 0,1 380,488 L 256,488 Z" fill="url(#bgRight)"/>

  <!-- Center Nose / Profile Line -->
  <path d="M 256,38 L 256,244 C 256,278 244,288 226,288 C 206,288 198,272 198,256" 
        fill="none" stroke="#0a2a4a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left Eye -->
  <ellipse cx="172" cy="190" rx="14" ry="24" fill="#0a2a4a"/>
  <!-- Right Eye -->
  <ellipse cx="340" cy="190" rx="14" ry="24" fill="#0a2a4a"/>

  <!-- Smile -->
  <path d="M 136,336 C 170,392 342,392 376,336" 
        fill="none" stroke="#0a2a4a" stroke-width="17" stroke-linecap="round"/>

  <!-- Smile End Dimples -->
  <path d="M 126,326 C 132,336 138,346 142,352" fill="none" stroke="#0a2a4a" stroke-width="14" stroke-linecap="round"/>
  <path d="M 386,326 C 380,336 374,346 370,352" fill="none" stroke="#0a2a4a" stroke-width="14" stroke-linecap="round"/>

  <!-- Chin Dividing Line -->
  <path d="M 256,388 L 256,478" fill="none" stroke="#0a2a4a" stroke-width="16" stroke-linecap="round"/>

  <!-- Subtle Bevel & Rim Light -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="none" stroke="url(#rimLight)" stroke-width="4"/>
</svg>