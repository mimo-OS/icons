<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#800000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#400000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="redBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff453a"/>
      <stop offset="60%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#d70015"/>
    </linearGradient>
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <clipPath id="squircleClip">
      <rect x="24" y="24" width="464" height="464" rx="108" ry="108"/>
    </clipPath>
  </defs>

  <!-- Shadow Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" filter="url(#shadow)" fill="#d70015"/>

  <g clip-path="url(#squircleClip)">
    <!-- Red Background -->
    <rect x="24" y="24" width="464" height="464" fill="url(#redBg)"/>

    <!-- Bell Icon in Pure White -->
    <g transform="translate(256, 250)" filter="drop-shadow(0 6px 12px rgba(120, 0, 0, 0.4))">
      <!-- Bell Body -->
      <path d="M 0,-130 
               C 16,-130 28,-118 28,-102 
               C 56,-92 90,-60 90,10 
               C 90,60 102,82 118,98 
               L 118,110 
               L -118,110 
               L -118,98 
               C -102,82 -90,60 -90,10 
               C -90,-60 -56,-92 -28,-102 
               C -28,-118 -16,-130 0,-130 Z" fill="#ffffff"/>

      <!-- Clapper at Bottom of Bell -->
      <path d="M -30,118 
               C -26,146 26,146 30,118 Z" fill="#ffffff"/>

      <!-- Top Loop -->
      <circle cx="0" cy="-122" r="14" fill="none" stroke="#ffffff" stroke-width="6"/>
    </g>

    <!-- Outer Rim Light -->
    <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="none" stroke="url(#rimLight)" stroke-width="4"/>
  </g>
</svg>