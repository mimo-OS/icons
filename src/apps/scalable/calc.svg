<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="calcBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </linearGradient>
    <linearGradient id="orangeBtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb340"/>
      <stop offset="100%" stop-color="#ff9500"/>
    </linearGradient>
    <linearGradient id="grayBtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#545458"/>
      <stop offset="100%" stop-color="#3a3a3c"/>
    </linearGradient>
    <linearGradient id="lightGrayBtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8e8e93"/>
      <stop offset="100%" stop-color="#636366"/>
    </linearGradient>
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="squircleClip">
      <rect x="24" y="24" width="464" height="464" rx="108" ry="108"/>
    </clipPath>
  </defs>

  <!-- Shadow Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" filter="url(#shadow)" fill="#1c1c1e"/>

  <g clip-path="url(#squircleClip)">
    <!-- Background -->
    <rect x="24" y="24" width="464" height="464" fill="url(#calcBg)"/>

    <!-- Keypad Grid Layout (4 columns x 4 rows) -->
    <!-- Row 1: AC, +/-, %, ÷ (orange) -->
    <circle cx="110" cy="120" r="38" fill="url(#lightGrayBtn)"/>
    <text x="110" y="129" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="28" font-weight="600" fill="#ffffff" text-anchor="middle">AC</text>

    <circle cx="206" cy="120" r="38" fill="url(#lightGrayBtn)"/>
    <text x="206" y="129" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="28" font-weight="600" fill="#ffffff" text-anchor="middle">±</text>

    <circle cx="304" cy="120" r="38" fill="url(#lightGrayBtn)"/>
    <text x="304" y="129" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="28" font-weight="600" fill="#ffffff" text-anchor="middle">%</text>

    <circle cx="402" cy="120" r="38" fill="url(#orangeBtn)"/>
    <text x="402" y="131" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="36" font-weight="500" fill="#ffffff" text-anchor="middle">÷</text>

    <!-- Row 2: 7, 8, 9, × (orange) -->
    <circle cx="110" cy="215" r="38" fill="url(#grayBtn)"/>
    <text x="110" y="226" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="32" font-weight="500" fill="#ffffff" text-anchor="middle">7</text>

    <circle cx="206" cy="215" r="38" fill="url(#grayBtn)"/>
    <text x="206" y="226" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="32" font-weight="500" fill="#ffffff" text-anchor="middle">8</text>

    <circle cx="304" cy="215" r="38" fill="url(#grayBtn)"/>
    <text x="304" y="226" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="32" font-weight="500" fill="#ffffff" text-anchor="middle">9</text>

    <circle cx="402" cy="215" r="38" fill="url(#orangeBtn)"/>
    <text x="402" y="226" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="34" font-weight="500" fill="#ffffff" text-anchor="middle">×</text>

    <!-- Row 3: 4, 5, 6, - (orange) -->
    <circle cx="110" cy="310" r="38" fill="url(#grayBtn)"/>
    <text x="110" y="321" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="32" font-weight="500" fill="#ffffff" text-anchor="middle">4</text>

    <circle cx="206" cy="310" r="38" fill="url(#grayBtn)"/>
    <text x="206" y="321" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="32" font-weight="500" fill="#ffffff" text-anchor="middle">5</text>

    <circle cx="304" cy="310" r="38" fill="url(#grayBtn)"/>
    <text x="304" y="321" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="32" font-weight="500" fill="#ffffff" text-anchor="middle">6</text>

    <circle cx="402" cy="310" r="38" fill="url(#orangeBtn)"/>
    <text x="402" y="321" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="38" font-weight="500" fill="#ffffff" text-anchor="middle">−</text>

    <!-- Row 4: 1, 2, 3, + (orange) -->
    <circle cx="110" cy="405" r="38" fill="url(#grayBtn)"/>
    <text x="110" y="416" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="32" font-weight="500" fill="#ffffff" text-anchor="middle">1</text>

    <circle cx="206" cy="405" r="38" fill="url(#grayBtn)"/>
    <text x="206" y="416" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="32" font-weight="500" fill="#ffffff" text-anchor="middle">2</text>

    <circle cx="304" cy="405" r="38" fill="url(#grayBtn)"/>
    <text x="304" y="416" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="32" font-weight="500" fill="#ffffff" text-anchor="middle">3</text>

    <circle cx="402" cy="405" r="38" fill="url(#orangeBtn)"/>
    <text x="402" y="418" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="36" font-weight="500" fill="#ffffff" text-anchor="middle">+</text>

    <!-- Outer Rim Light -->
    <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="none" stroke="url(#rimLight)" stroke-width="4"/>
  </g>
</svg>